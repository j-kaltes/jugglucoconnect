services:
  rendezvous:
    build:
      context: .
    image: jugglucoconnect:local
    restart: unless-stopped
    stop_grace_period: 3s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    ports:
      - "6789:6789/tcp"
    volumes:
      - type: bind
        source: ./fullchain.pem
        target: /data/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./privkey.pem
        target: /data/privkey.pem
        read_only: true
        bind:
          create_host_path: false
